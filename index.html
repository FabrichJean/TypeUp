<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TypeUp : entraîne ta vitesse de frappe sur de vrais textes (virelangues, blagues, poèmes, code, Wikipédia)." />
    <title>TypeUp</title>
    <!-- Applique le thème choisi avant le premier affichage (évite un flash clair). -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('typeup.prefs') || '{}').theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
